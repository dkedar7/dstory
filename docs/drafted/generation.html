}

function buildPinnedScene(scene) {
  const wrap = el("section", { class: "scene scene--pinned", "data-scene": scene.id, id: scene.id });
  const pin = el("div", { class: "scene__pin", "data-mount": scene.id });
  wrap.append(pin);
  if (scene.source_line) wrap.append(el("p", { class: "scene__source" }, scene.source_line));
  return wrap;
}

function buildVizzuScene(scene) {
  // Same shape as scrolly: sticky chart + stepping text. The chart is a Vizzu
  // canvas that morphs between frames on each step.
  const wrap = el("section", { class: "scene scene--scrolly scene--vizzu", "data-scene": scene.id, id: scene.id });
  wrap.append(el("div", { class: "scene__graphic", "data-mount": scene.id }));
  const text = el("div", { class: "scene__text" });
  if (scene.headline) {
    const heading = el("h3", { class: "scene--vizzu__headline" }, scene.headline);
    text.append(heading);
  }
  (scene.frames || []).forEach((frame, i) => {
    const s = el("div", { class: "step", "data-step": String(i) });
    s.append(el("h3", {}, frame.headline || ""));
    if (frame.commentary) s.append(el("p", {}, frame.commentary));
    text.append(s);
  });
  wrap.append(text);
  if (scene.source_line) wrap.append(el("p", { class: "scene__source" }, scene.source_line));
  return wrap;
}

function activateScrollyScene(sceneEl, scene, data, slidesMode = false) {
  const renderer = SCENE_RENDERERS[scene.id];
  if (!renderer) return null;
  const mount = sceneEl.querySelector(`[data-mount="${scene.id}"]`);
  const ctrl = renderer(mount, data, scene); // expected to return { onStep(i, dir) } or null
  if (slidesMode) return ctrl;  // slides controller drives onStep

  const scroller = scrollama();
  scroller.setup({
    step: sceneEl.querySelectorAll(".step"),
    offset: 0.5,
    debug: false,
  }).onStepEnter(({ element, index, direction }) => {
    element.classList.add("is-active");
    if (ctrl && typeof ctrl.onStep === "function") ctrl.onStep(index, direction);
  }).onStepExit(({ element, direction }) => {
    if (direction === "up") element.classList.remove("is-active");
  });

  window.addEventListener("resize", () => scroller.resize());
  return ctrl;
}

function activateBleedScene(sceneEl, scene, data, slidesMode = false) {
  const renderer = SCENE_RENDERERS[scene.id];
  if (renderer) {
    const mount = sceneEl.querySelector(`[data-mount="${scene.id}"]`);
    renderer(mount, data, scene);
  }
  if (slidesMode || reduceMotion) return null;  // slides controller handles entry; CSS drives the rest
  inView(sceneEl, () => {
    animate(
      [sceneEl.querySelector("h2"), sceneEl.querySelector("p")].filter(Boolean),
      { opacity: [0, 1], y: [12, 0] },
      { duration: 0.7, easing: [0.22, 1, 0.36, 1], delay: stagger(0.12, { start: 0.1 }) }
    );
  }, { margin: "0px 0px -25% 0px" });
  return null;
}

function activatePinnedScene(sceneEl, scene, data, slidesMode = false) {
  const renderer = SCENE_RENDERERS[scene.id];
  if (!renderer) return null;
  const mount = sceneEl.querySelector(`[data-mount="${scene.id}"]`);
  const ctrl = renderer(mount, data, scene);
  if (!ctrl || typeof ctrl.onProgress !== "function") return ctrl;
  if (slidesMode) {
    // Pinned scenes are scroll-progress driven; in slides mode, show end state.
    ctrl.onProgress(1);
    return ctrl;
  }

  // Use IntersectionObserver + requestAnimationFrame for progress 0..1
  let raf = null;
  const update = () => {
    const r = sceneEl.getBoundingClientRect();
    const total = r.height - window.innerHeight;
    const p = Math.min(1, Math.max(0, -r.top / total));
    ctrl.onProgress(p);
    raf = null;
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();
  return ctrl;
}

function revealOnEnter(sceneEl) {
  // Gentle entry reveal for simple scenes (headline → commentary → chart).
  // Skipped under prefers-reduced-motion; harmless no-op if Motion is absent.
  if (reduceMotion) return;
  const targets = [
    sceneEl.querySelector(":scope > h2"),
    sceneEl.querySelector(":scope > p"),
    sceneEl.querySelector(".scene__graphic"),
  ].filter(Boolean);
  if (!targets.length) return;
  inView(sceneEl, () => {
    animate(
      targets,
      { opacity: [0, 1], y: [14, 0] },
      { duration: 0.65, easing: [0.22, 1, 0.36, 1], delay: stagger(0.1) }
    );
  }, { margin: "0px 0px -18% 0px" });
}

function activateSimpleScene(sceneEl, scene, data, slidesMode = false) {
  if (!slidesMode) revealOnEnter(sceneEl);
  const renderer = SCENE_RENDERERS[scene.id];
  if (!renderer) return null;
  const mount = sceneEl.querySelector(`[data-mount="${scene.id}"]`);
  // Render immediately. Renderer may use inView internally for entry animations.
  return renderer(mount, data, scene);
}

function activateCustomScene(sceneEl, scene, data, slidesMode = false) {
  // The section IS the mount. The renderer owns the entire DOM and is free to
  // build any layout, including reading scene.headline / scene.commentary /
  // scene.source_line itself if it wants to display them.
  const renderer = SCENE_RENDERERS[scene.id];
  if (!renderer) {
    console.warn(`[dstory] kind:"custom" scene "${scene.id}" has no registered renderer.`);
    return null;
  }
  return renderer(sceneEl, data, scene);
}

function waitForVizzu(timeoutMs = 4000) {
  return new Promise(resolve => {
    if (window.Vizzu) return resolve(window.Vizzu);
    const t = setTimeout(() => resolve(null), timeoutMs);
    const check = setInterval(() => {
      if (window.Vizzu) { clearInterval(check); clearTimeout(t); resolve(window.Vizzu); }
    }, 30);
  });
}

function buildVizzuStyle() {
  // Map theme CSS custom properties → Vizzu style object so charts inherit theme.
  const cs = getComputedStyle(document.documentElement);
  const get = k => (cs.getPropertyValue(k) || "").trim();
  const palette = [1, 2, 3, 4, 5, 6, 7]
    .map(i => get(`--cat-${i}`)).filter(Boolean).join(" ");
  const ink     = get("--ink") || "#111";
  const inkSoft = get("--ink-soft") || "#666";
  const inkFaint= get("--ink-faint") || "#999";
  const bgElev  = get("--bg-elev") || "#fff";
  const fontDisplay = get("--font-display") || "Georgia, serif";
  const fontBody    = get("--font-body")    || "system-ui, sans-serif";

  return {
    fontFamily: fontBody,
    backgroundColor: bgElev,
    plot: {
      backgroundColor: bgElev,
      marker: { colorPalette: palette || undefined },
      xAxis: {
        label: { fontSize: 11, color: inkFaint },
        title: { color: inkSoft, fontSize: 11 },
        interlacing: { color: "#00000000" },   // hide alternating bands (transparent)
      },
      yAxis: {
        label: { fontSize: 11, color: inkFaint },
        title: { color: inkSoft, fontSize: 11 },
        interlacing: { color: "#00000000" },
      },
    },
    title: {
      fontFamily: fontDisplay,
      color: ink,
      fontSize: 18,
      paddingTop: 8, paddingBottom: 8,
    },
    legend: {
      label: { color: inkSoft, fontSize: 11 },
      title: { color: inkSoft, fontSize: 11 },
    },
    logo: { filter: "opacity(0)" },             // hide Vizzu logo
  };
}

async function activateVizzuScene(sceneEl, scene, data, slidesMode = false) {
  const Vizzu = await waitForVizzu();
  if (!Vizzu) {
    console.warn("Vizzu not available — scene", scene.id, "will be inert.");
    // Degrade to words, not an empty box: show the chart's description.
    const mount = sceneEl.querySelector(`[data-mount="${scene.id}"]`);
    if (mount && scene.alt && !mount.childElementCount) {
      mount.append(el("p", { class: "scene__fallback" },
        `${scene.alt} (The animated chart needs an internet connection.)`));
    }
    return null;
  }
  const records = data.datasets?.[scene.dataset];
  if (!Array.isArray(records) || records.length === 0) {
    console.warn("Vizzu scene", scene.id, "missing dataset:", scene.dataset);
    return null;
  }

  const mount = sceneEl.querySelector(`[data-mount="${scene.id}"]`);
  const chart = new Vizzu(mount);

  const series = (scene.series || []).map(s => ({
    name: s.name,
    type: s.type === "measure" ? "measure" : "dimension",
  }));

  // Custom renderer can override default behavior.
  const customRenderer = SCENE_RENDERERS[scene.id];
  if (customRenderer) {
    return customRenderer(mount, data, scene); // hand it the mount; it owns the chart
  }

  const themeStyle = buildVizzuStyle();
  const userStyle  = scene.style || {};

  await chart.initializing;
  const firstFrame = (scene.frames && scene.frames[0]) || {};
  try {
    await chart.animate({
      data: { series, records },
      config: firstFrame.config || {},
      style:  { ...themeStyle, ...userStyle },
    });
  } catch (e) {
    console.error(`[dstory] Vizzu init failed for scene "${scene.id}":`, e?.message || e);
    // Recover gracefully: re-try without the theme style override. Most of our
    // Vizzu issues historically have been style-shape mismatches; the chart
    // itself is usually fine.
    try {
      await chart.animate({
        data: { series, records },
        config: firstFrame.config || {},
      });
      console.warn(`[dstory] Scene "${scene.id}" rendered with default Vizzu style (theme override rejected).`);
    } catch (e2) {
      console.error(`[dstory] Scene "${scene.id}" failed to render even without style:`, e2?.message || e2);
      // Don't throw — let the rest of the page initialize.
    }
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const duration = reduce ? 0 : (scene.duration || 1.0);

  // Morph scheduler: latest target wins. chart.animate() QUEUES animations,
  // so a fast scroll through N steps would otherwise play N back-to-back
  // morphs while the text runs ahead of the chart. While a morph is in
  // flight we keep only the newest requested frame and play it when the
  // current one finishes — stale intermediate frames are skipped. (Frames
  // should be self-contained for this reason: set geometry, coordSystem,
  // and any align/split resets explicitly in every frame.)
  let morphing = false;
  let queuedConfig = null;
  function morphTo(config) {
    if (morphing) { queuedConfig = config; return; }
    morphing = true;
    const next = () => {
      morphing = false;
      if (queuedConfig) {
        const c = queuedConfig;
        queuedConfig = null;
        morphTo(c);
      }
    };
    chart.animate({ config }, duration).then(next, next);
  }

  // ctrl that the slides controller (or scroll mode) can call to morph to a frame.
  const ctrl = {
    onStep(i /*, direction */) {
      const frame = (scene.frames || [])[i];
      if (frame && frame.config) morphTo(frame.config);
    },
  };

  if (slidesMode) return ctrl;

  const scroller = scrollama();
  scroller.setup({
    step: sceneEl.querySelectorAll(".step"),
    offset: 0.5,
    debug: false,
  }).onStepEnter(({ element, index, direction }) => {
    element.classList.add("is-active");
    ctrl.onStep(index, direction);
  }).onStepExit(({ element, direction }) => {
    if (direction === "up") element.classList.remove("is-active");
  });
  window.addEventListener("resize", () => scroller.resize());
  return ctrl;
}

function setupProgressRail() {
  // Reading progress (scroll mode). The rail lives in index.html; we only
  // drive the fill's scaleX from scroll position, throttled to one rAF.
  const fill = document.querySelector("[data-progress] .progress-rail__fill");
  if (!fill) return;
  let raf = null;
  const update = () => {
    const total = document.documentElement.scrollHeight - window.innerHeight;
    const p = total > 0 ? Math.min(1, Math.max(0, window.scrollY / total)) : 0;
    fill.style.transform = `scaleX(${p})`;
    raf = null;
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();
}

function setupSlidesController(builtScenes, data) {
  const heroEl  = document.querySelector(".hero");
  const outroEl = document.querySelector(".outro");
  document.documentElement.classList.add("story-mode--slides");
  document.body.classList.add("story-mode--slides");

  // Flat slide list: [hero, ...one-per-step-or-frame, outro].
  const slides = [];
  if (heroEl) slides.push({ kind: "hero", el: heroEl });
  for (const entry of builtScenes) {
    const stepCount = entry.scene.steps?.length || entry.scene.frames?.length || 1;
    for (let i = 0; i < stepCount; i++) {
      slides.push({ kind: "scene", el: entry.node, sceneEntry: entry, stepIdx: i, totalSteps: stepCount });
    }
  }
  if (outroEl) slides.push({ kind: "outro", el: outroEl });

  // Initialize: every slide hidden except the first.
  slides.forEach((s, i) => {
    if (i === 0) {
      s.el.classList.add("is-current");
    } else {
      s.el.setAttribute("aria-hidden", "true");
    }
  });

  let current = 0;
  const indicator = document.querySelector("[data-slide-indicator]");
  const updateIndicator = () => {
    if (indicator) indicator.textContent = `${current + 1} / ${slides.length}`;
  };
  updateIndicator();

  // Deep-linking: keep #slide-N in the URL so a specific slide can be shared
  // ("open the deck at slide 12"). replaceState avoids history spam.
  const syncHash = () => {
    try { history.replaceState(null, "", `#slide-${current + 1}`); } catch (_) {}
  };

  function show(idx, dir = "forward") {
    if (idx < 0 || idx >= slides.length) return;
    if (idx === current) return;
    const prev = slides[current];
    const next = slides[idx];

    if (prev.el !== next.el) {
      prev.el.classList.remove("is-current");
      prev.el.setAttribute("aria-hidden", "true");
      next.el.classList.add("is-current");
      next.el.removeAttribute("aria-hidden");
    }

    if (next.kind === "scene") {
      const steps = next.el.querySelectorAll(".step");
      steps.forEach((st, i) => st.classList.toggle("is-active", i === next.stepIdx));
      if (next.sceneEntry.ctrl?.onStep) {
        next.sceneEntry.ctrl.onStep(next.stepIdx, dir === "forward" ? "down" : "up");
      }
    }

    current = idx;
    updateIndicator();
    syncHash();
  }

  // Trigger first slide's chart state if applicable.
  const first = slides[0];
  if (first?.kind === "scene") {
    const steps = first.el.querySelectorAll(".step");
    steps.forEach((st, i) => st.classList.toggle("is-active", i === first.stepIdx));
    if (first.sceneEntry.ctrl?.onStep) first.sceneEntry.ctrl.onStep(first.stepIdx, "down");
  }

  // Keyboard navigation
  document.addEventListener("keydown", (e) => {
    if (e.target.matches?.("input, textarea, [contenteditable]")) return;
    switch (e.key) {
      case "ArrowRight":
      case "PageDown":
      case " ":
        e.preventDefault(); show(current + 1, "forward"); break;
      case "ArrowLeft":
      case "PageUp":
        e.preventDefault(); show(current - 1, "backward"); break;
      case "Home":
        e.preventDefault(); show(0, "backward"); break;
      case "End":
        e.preventDefault(); show(slides.length - 1, "forward"); break;
    }
  });

  // Click-anywhere navigation (skip interactive elements + the controls bar)
  document.addEventListener("click", (e) => {
    if (e.target.closest("a, button, input, textarea, select, [contenteditable], [data-slide-controls]")) return;
    if (e.shiftKey) show(current - 1, "backward");
    else show(current + 1, "forward");
  });

  // Buttons
  document.querySelector("[data-slide-prev]")?.addEventListener("click", () => show(current - 1, "backward"));
  document.querySelector("[data-slide-next]")?.addEventListener("click", () => show(current + 1, "forward"));

  // Reveal the controls.
  const controlsEl = document.querySelector("[data-slide-controls]");
  if (controlsEl) controlsEl.removeAttribute("hidden");

  // Honor an incoming #slide-N deep link.
  const hashMatch = location.hash.match(/^#slide-(\d+)$/);
  if (hashMatch) {
    const idx = Math.min(slides.length - 1, Math.max(0, parseInt(hashMatch[1], 10) - 1));
    if (idx > 0) show(idx, "forward");
  }
}

async function init() {
  await waitForMotion();
  const data = await getData();

  // Language / direction — bundle time patches the static <html> tag; this
  // covers dev mode (fetch) and keeps the two paths consistent.
  if (data.meta?.lang) document.documentElement.lang = data.meta.lang;
  if (data.meta?.dir && data.meta.dir !== "ltr") document.documentElement.dir = data.meta.dir;

  renderHero(data.meta || {});
  renderSources(data.meta?.sources || [], data.meta || {});

  const slidesMode = data.meta?.mode === "slides";
  if (slidesMode) {
    document.documentElement.classList.add("story-mode--slides");
    document.body.classList.add("story-mode--slides");
  } else {
    setupProgressRail();
  }

  const story = document.getElementById("story");
  const built = (data.scenes || []).map(s => {
    const node = buildScene(s);
    story.append(node);
    return { node, scene: s, ctrl: null };
  });

  // Wait one frame so layout settles before activating renderers.
  // We use setTimeout(16) rather than requestAnimationFrame because rAF can
  // be starved on very long pages (>10k px) when other scripts (e.g. Vizzu
  // wasm) are still initializing. setTimeout always fires.
  await new Promise(r => setTimeout(r, 16));
  const reportFailure = (s, err) =>
    // Don't let one failing scene kill the rest of the page.
    console.error(`[dstory] Scene "${s.id}" failed to activate:`, err?.message || err);

  // Every non-Vizzu scene activates right away. Vizzu scenes wait for their
  // library + WASM (CDN, up to a 4 s timeout offline), so they initialise in
  // parallel and never hold back the charts that follow them.
  const pending = [];
  for (const entry of built) {
    const s = entry.scene;
    try {
      if (s.kind === "scrolly")      entry.ctrl = activateScrollyScene(entry.node, s, data, slidesMode);
      else if (s.kind === "bleed")   entry.ctrl = activateBleedScene(entry.node, s, data, slidesMode);
      else if (s.kind === "pinned")  entry.ctrl = activatePinnedScene(entry.node, s, data, slidesMode);
      else if (s.kind === "vizzu") {
        pending.push(
          activateVizzuScene(entry.node, s, data, slidesMode)
            .then(ctrl => { entry.ctrl = ctrl; })
            .catch(err => reportFailure(s, err))
        );
      }
      else if (s.kind === "custom")  entry.ctrl = activateCustomScene(entry.node, s, data, slidesMode);
      else                            entry.ctrl = activateSimpleScene(entry.node, s, data, slidesMode);
    } catch (sceneErr) {
      reportFailure(s, sceneErr);
    }
  }

  // The slides controller drives each scene's ctrl, so it needs the Vizzu
  // controllers too. Non-Vizzu slides are already painted meanwhile.
  await Promise.all(pending);
  if (slidesMode) setupSlidesController(built, data);
}

// Defer init until DOMContentLoaded so all `<script defer>` scenes have had
// a chance to call STORY.register() (defer scripts execute in document order
// and complete before DOMContentLoaded fires).
if (document.readyState === "complete") {
  // Page already fully loaded — call init directly on next microtask.
  Promise.resolve().then(init);
} else {
  document.addEventListener("DOMContentLoaded", () => init(), { once: true });
}

</script>
  <script>
// recipe: slope-chart
// kind: simple
// summary: Two-period comparison — what rose, what fell, and by how much, with direct labels.
//
// Dataset rows: { "<label>": "Product", "<start>": 42, "<end>": 61 }
// scene.config (all optional):
//   { "label": "label", "start": "start", "end": "end",
//     "start_label": "2020", "end_label": "2024",
//     "highlight": ["Product"], "format": "," }
//
// Set scene.alt in data.json — one sentence: what the chart shows and the takeaway.

STORY.register("scene-shift", function draw(mount, data, scene) {
  const cfg = scene.config || {};
  const L = cfg.label || "label", S = cfg.start || "start", E = cfg.end || "end";
  const highlight = new Set(cfg.highlight || []);
  const fmt = d3.format(cfg.format || ",");
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const rows = (data.datasets?.[scene.dataset] || [])
    .map(d => ({ label: d[L], start: +d[S], end: +d[E] }))
    .filter(d => d.label != null && !isNaN(d.start) && !isNaN(d.end));
  if (!rows.length) { console.warn("[slope-chart] empty dataset:", scene.dataset); return null; }

  const W = 720, H = Math.max(360, rows.length * 44 + 96);
  const margin = { top: 48, right: 170, bottom: 24, left: 170 };
  const w = W - margin.left - margin.right, h = H - margin.top - margin.bottom;

  const svg = d3.select(mount).append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("aria-hidden", "true")
    .style("width", "100%").style("height", "auto").style("display", "block");
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const y = d3.scaleLinear()
    .domain([
      Math.min(0, d3.min(rows, d => Math.min(d.start, d.end))),
      d3.max(rows, d => Math.max(d.start, d.end)),
    ]).nice().range([h, 0]);

  // Period rails + headers
  for (const [px, name] of [[0, cfg.start_label || "Before"], [w, cfg.end_label || "After"]]) {
    g.append("line").attr("x1", px).attr("x2", px).attr("y1", 0).attr("y2", h)
      .attr("stroke", "var(--rule)").attr("stroke-opacity", 0.5);
    g.append("text").attr("class", "annotation").attr("x", px).attr("y", -20)
      .attr("text-anchor", "middle").attr("font-weight", 600).text(name);
  }

  const color = d => highlight.size === 0 || highlight.has(d.label)
    ? "var(--accent)" : "var(--ink-faint)";
  const emphasis = d => highlight.size === 0 || highlight.has(d.label) ? 1 : 0.55;

  // Dodge label rows that would overlap (greedy pass, preserves order).
  function dodge(values, gap) {
    const idx = values.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v);
    for (let k = 1; k < idx.length; k++) {
      if (idx[k].v - idx[k - 1].v < gap) idx[k].v = idx[k - 1].v + gap;
    }
    const out = new Array(values.length);
    idx.forEach(d => { out[d.i] = d.v; });
    return out;
  }
  const startLabelY = dodge(rows.map(d => y(d.start)), 16);
  const endLabelY   = dodge(rows.map(d => y(d.end)), 16);

  const slope = g.selectAll("g.slope").data(rows).join("g").attr("class", "slope");
  slope.append("line")
    .attr("x1", 0).attr("y1", d => y(d.start))
    .attr("x2", REDUCE ? w : 0).attr("y2", d => y(REDUCE ? d.end : d.start))
    .attr("stroke", color).attr("stroke-width", 2).attr("opacity", emphasis)
    .transition().duration(REDUCE ? 0 : 800).ease(d3.easeCubicOut)
    .attr("x2", w).attr("y2", d => y(d.end));
  slope.append("circle").attr("cx", 0).attr("cy", d => y(d.start)).attr("r", 3.5)
    .attr("fill", color).attr("opacity", emphasis);
  slope.append("circle").attr("cx", w).attr("cy", d => y(d.end)).attr("r", 3.5)
    .attr("fill", color).attr("opacity", 0)
    .transition().delay(REDUCE ? 0 : 700).duration(200).attr("opacity", emphasis);

  slope.append("text").attr("class", "annotation")
    .attr("x", -10).attr("y", (d, i) => startLabelY[i]).attr("dy", "0.32em")
    .attr("text-anchor", "end").attr("opacity", emphasis)
    .text(d => `${d.label}  ${fmt(d.start)}`);
  slope.append("text").attr("class", "annotation annotation--strong")
    .attr("x", w + 10).attr("y", (d, i) => endLabelY[i]).attr("dy", "0.32em")
    .attr("fill", color).attr("opacity", 0)
    .text(d => `${fmt(d.end)}  ${d.label}`)
    .transition().delay(REDUCE ? 0 : 750).duration(300).attr("opacity", emphasis);

  return null;
});

</script>
  <script>
// recipe: bump-chart
// kind: simple
// summary: Rank over time — who overtook whom, with end labels and a highlight set.
//
// Dataset rows (long format): { "<x>": "2021", "<series>": "Python", "<y>": 48.2 }
// Rank is computed per period from <y> (1 = highest value).
// scene.config (all optional):
//   { "x": "period", "series": "name", "y": "value", "highlight": ["Python"] }
//
// Set scene.alt in data.json — one sentence: what the chart shows and the takeaway.

STORY.register("scene-race", function draw(mount, data, scene) {
  const cfg = scene.config || {};
  const X = cfg.x || "period", S = cfg.series || "name", Y = cfg.y || "value";
  const highlight = new Set(cfg.highlight || []);
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const raw = (data.datasets?.[scene.dataset] || [])
    .map(d => ({ x: String(d[X]), series: d[S], y: +d[Y] }))
    .filter(d => d.series != null && !isNaN(d.y));
  if (!raw.length) { console.warn("[bump-chart] empty dataset:", scene.dataset); return null; }

  // Rank within each period (1 = highest value).
  const periods = [...new Set(raw.map(d => d.x))];
  for (const p of periods) {
    const inP = raw.filter(d => d.x === p).sort((a, b) => b.y - a.y);
    inP.forEach((d, i) => { d.rank = i + 1; });
  }
  const bySeries = d3.group(raw, d => d.series);
  const nRanks = d3.max(raw, d => d.rank);

  const W = 720, H = Math.max(320, nRanks * 44 + 80);
  const margin = { top: 24, right: 130, bottom: 36, left: 130 };
  const w = W - margin.left - margin.right, h = H - margin.top - margin.bottom;

  const svg = d3.select(mount).append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("aria-hidden", "true")
    .style("width", "100%").style("height", "auto").style("display", "block");
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scalePoint().domain(periods).range([0, w]);
  const y = d3.scalePoint().domain(d3.range(1, nRanks + 1)).range([0, h]);

  g.append("g").attr("transform", `translate(0,${h + 16})`)
    .call(d3.axisBottom(x).tickSize(0))
    .call(s => s.select(".domain").remove())
    .selectAll("text").attr("class", "annotation");

  const emphasized = s => highlight.size === 0 || highlight.has(s);
  const seriesNames = [...bySeries.keys()];
  const palette = seriesNames.map((_, i) => `var(--cat-${(i % 7) + 1})`);
  const color = s => emphasized(s)
    ? (highlight.size ? "var(--accent)" : palette[seriesNames.indexOf(s)])
    : "var(--ink-faint)";

  const line = d3.line()
    .x(d => x(d.x)).y(d => y(d.rank)).curve(d3.curveMonotoneX);

  for (const [name, points] of bySeries) {
    points.sort((a, b) => periods.indexOf(a.x) - periods.indexOf(b.x));
    const p = g.append("path").datum(points)
      .attr("fill", "none")
      .attr("stroke", color(name))
      .attr("stroke-width", emphasized(name) ? 3 : 1.5)
      .attr("opacity", emphasized(name) ? 1 : 0.45)
      .attr("d", line);
    if (!REDUCE) {
      const total = p.node().getTotalLength();
      p.attr("stroke-dasharray", total).attr("stroke-dashoffset", total)
        .transition().duration(1000).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0);
    }
    g.selectAll(null).data(points).join("circle")
      .attr("cx", d => x(d.x)).attr("cy", d => y(d.rank)).attr("r", 4)
      .attr("fill", color(name)).attr("opacity", emphasized(name) ? 1 : 0.45);

    const first = points[0], lastP = points[points.length - 1];
    g.append("text").attr("class", "annotation")
      .attr("x", x(first.x) - 10).attr("y", y(first.rank)).attr("dy", "0.32em")
      .attr("text-anchor", "end").attr("fill", color(name))
      .attr("font-weight", emphasized(name) ? 600 : 400)
      .attr("opacity", emphasized(name) ? 1 : 0.6)
      .text(`${first.rank}. ${name}`);
    g.append("text").attr("class", "annotation")
      .attr("x", x(lastP.x) + 10).attr("y", y(lastP.rank)).attr("dy", "0.32em")
      .attr("fill", color(name))
      .attr("font-weight", emphasized(name) ? 600 : 400)
      .attr("opacity", emphasized(name) ? 1 : 0.6)
      .text(`${lastP.rank}. ${name}`);
  }
  return null;
});

</script>

<script data-dstory="data-panel">
// dstory data panel: every chart ships its own data.
//
// Injected by `dstory bundle` (and build()) into every story. Under each scene
// that has a `dataset`, it adds a collapsed "Data" disclosure holding a real
// <table> (screen-reader and keyboard friendly) and a "Download CSV" link built
// from the inlined data, so it works offline. It is renderer-agnostic: it reads
// window.__STORY_DATA__ and never looks inside a chart.
//
// Turn parts off in data.json:  "meta": {"a11y": {"table": false, "download": false}}
// or per scene:                 {"id": "s1", "a11y": {"table": false}, "table_columns": ["month", "value"]}
// or for the whole bundle:      dstory bundle my-story --no-a11y-extras
(() => {
  "use strict";
  if (window.__DSTORY_DATA_PANEL__) return;
  const MAX_ROWS = 50;
  const attached = {};

  const dataOf = () => window.__STORY_DATA__ || null;
  const option = (data, scene, key) => {
    const s = (scene && scene.a11y) || {};
    const m = (data && data.meta && data.meta.a11y) || {};
    const v = s[key] !== undefined && s[key] !== null ? s[key]
      : m[key] !== undefined && m[key] !== null ? m[key] : true;
    return v !== false;
  };
  const slides = () => document.body.classList.contains("story-mode--slides");

  const rowsOf = (data, scene) => {
    const rows = scene && scene.dataset && data.datasets ? data.datasets[scene.dataset] : null;
    return Array.isArray(rows) && rows.length ? rows : null;
  };
  const columnsOf = (rows, scene) => {
    if (Array.isArray(scene.table_columns) && scene.table_columns.length) return scene.table_columns.slice();
    const cols = [];
    for (const r of rows.slice(0, 500)) {
      if (r && typeof r === "object") for (const k of Object.keys(r)) if (!cols.includes(k)) cols.push(k);
    }
    return cols;
  };

  let nf = null, nfRaw = null;
  const lang = () => (dataOf() && dataOf().meta && dataOf().meta.lang) || undefined;
  const numberFormat = (grouping) => {
    try { return new Intl.NumberFormat(lang(), { maximumFractionDigits: 6, useGrouping: grouping }); }
    catch (e) { return new Intl.NumberFormat(undefined, { maximumFractionDigits: 6, useGrouping: grouping }); }
  };
  // fmt(v, raw): raw drops the thousands separator (years, IDs, codes) but
  // keeps the locale's decimal mark.
  const fmt = (v, raw) => {
    if (v === null || v === undefined) return "";
    if (typeof v === "number") {
      if (raw) return (nfRaw || (nfRaw = numberFormat(false))).format(v);
      return (nf || (nf = numberFormat(true))).format(v);
    }
    if (typeof v === "object") return JSON.stringify(v);
    return String(v);
  };
  // Columns whose numbers are labels, not quantities: "2020" is a year, not
  // two thousand and twenty. Override per scene with
  // "table_format": {"col": "raw" | "number"}.
  const ID_NAME = /(^|[_\s-])(year|yr|fy|id|code|fips|zip|zipcode|postcode|postal|geoid|isbn|sku|ean|upc)s?$/i;
  const isRawColumn = (rows, col, scene) => {
    const o = scene && scene.table_format && scene.table_format[col];
    if (o === "raw") return true;
    if (o === "number") return false;
    const vals = rows.map(r => r ? r[col] : null).filter(v => typeof v === "number");
    if (!vals.length || !vals.every(Number.isInteger)) return false;
    if (ID_NAME.test(String(col)) || /^id$/i.test(String(col))) return true;
    return vals.every(v => v >= 1000 && v <= 2999);          // looks like years
  };
  const rawColumns = (rows, cols, scene) => cols.map(c => isRawColumn(rows, c, scene));
  const cellText = (rows, i, cols, scene) => {
    const raw = rawColumns(rows, cols, scene);
    return cols.map((c, j) => fmt(rows[i] ? rows[i][c] : "", raw[j]));
  };
  // CSV: raw values (not locale-formatted), RFC 4180 quoting. Text that a
  // spreadsheet would run as a formula (OWASP: = + - @ tab CR, and their
  // full-width forms) is prefixed with a quote; a plain number stored as text
  // ("-5", "+1.2%") is left alone.
  const FORMULA = /^[=+\-@\t\r\uFF1D\uFF0B\uFF0D\uFE63\u2212\uFF20]/;
  const PLAIN_NUMBER = /^[+\-\u2212]?(\d[\d,]*)?(\.\d+)?([eE][+-]?\d+)?%?$/;
  const csvCell = (v) => {
    if (v === null || v === undefined) return "";
    let t = typeof v === "object" ? JSON.stringify(v) : String(v);
    if (typeof v === "string") {
      const lead = t.replace(/^[ \u00A0]+/, "");
      if (FORMULA.test(lead) && !(PLAIN_NUMBER.test(lead) && /\d/.test(lead))) t = "'" + t;
    }
    return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const csvRow = (r, cols) => cols.map(c => csvCell(r ? r[c] : "")).join(",");
  const toCSV = (rows, cols) => [cols.map(csvCell).join(","), ...rows.map(r => csvRow(r, cols))].join("\r\n");

  const headlineOf = (s) => s.headline
    || (s.steps && s.steps[0] && s.steps[0].headline)
    || (s.frames && s.frames[0] && s.frames[0].headline) || s.id;

  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
    for (const k of kids) if (k != null) n.append(typeof k === "string" ? document.createTextNode(k) : k);
    return n;
  }

  function fillBody(tbody, rows, cols, numeric, raw, upto) {
    const frag = document.createDocumentFragment();
    for (const r of rows.slice(tbody.rows.length, upto)) {
      const tr = h("tr");
      cols.forEach((c, i) => {
        const cell = h(i === 0 ? "th" : "td", i === 0 ? { scope: "row" } : {}, fmt(r ? r[c] : "", raw[i]));
        if (numeric[i]) cell.classList.add("num");
        tr.append(cell);
      });
      frag.append(tr);
    }
    tbody.append(frag);
  }

  function panelFor(data, scene) {
    const rows = rowsOf(data, scene);
    if (!rows) return null;
    const wantTable = option(data, scene, "table");
    const wantCsv = option(data, scene, "download");
    if (!wantTable && !wantCsv) return null;
    const cols = columnsOf(rows, scene);
    const n = rows.length;
    const label = `${n.toLocaleString()} row${n === 1 ? "" : "s"}`;
    const details = h("details", { class: "scene-data", "data-scene-data": scene.id });
    details.append(h("summary", {}, wantTable ? "Data" : "Get the data",
      h("span", { class: "scene-data__count" }, ` · ${label}`)));
    const body = h("div", { class: "scene-data__body" });
    if (wantTable) {
      const numeric = cols.map(c => rows.every(r => !r || r[c] == null || typeof r[c] === "number")
        && rows.some(r => r && typeof r[c] === "number"));
      const table = h("table", { "data-rows": String(n), "data-cols": cols.join("\u001f") });
      table.append(h("caption", {}, `Underlying data: ${headlineOf(scene)} (${label})`));
      const hr = h("tr");
      cols.forEach((c, i) => hr.append(h("th", { scope: "col", class: numeric[i] ? "num" : "" }, c)));
      table.append(h("thead", {}, hr));
      const tbody = h("tbody");
      table.append(tbody);
      const raw = rawColumns(rows, cols, scene);
      fillBody(tbody, rows, cols, numeric, raw, Math.min(n, MAX_ROWS));
      body.append(h("div", { class: "scene-data__scroll", tabindex: "0", role: "region",
        "aria-label": `Data table: ${headlineOf(scene)}` }, table));
      if (n > MAX_ROWS) {
        const more = h("button", { type: "button", class: "scene-data__all" }, `Show all ${label}`);
        more.addEventListener("click", () => { fillBody(tbody, rows, cols, numeric, raw, n); more.remove(); });
        body.append(more);
      }
    }
    if (wantCsv) {
      const href = "data:text/csv;charset=utf-8," + encodeURIComponent("﻿" + toCSV(rows, cols));
      body.append(h("p", { class: "scene-data__actions" },
        h("a", { class: "scene-data__csv", href, download: `${scene.id}.csv` }, "Download CSV")));
    }
    details.append(body);
    // In slides mode a click anywhere advances the deck; the panel is not "anywhere".
    details.addEventListener("click", e => e.stopPropagation());
    return details;
  }

  function place(scene, section, panel) {
    if (scene.kind === "custom") {
      // A custom renderer owns its whole <section>: sit after it, never inside.
      if (slides()) return false;
      section.after(panel);
      return true;
    }
    const inner = scene.kind === "bleed" ? section.querySelector(".scene__bleedinner") : null;
    (inner || section).append(panel);
    return true;
  }

  function attachAll() {
    const data = dataOf();
    if (!data || !Array.isArray(data.scenes)) return true;
    let done = true;
    for (const scene of data.scenes) {
      if (!scene || !scene.id || attached[scene.id] !== undefined) continue;
      if (!rowsOf(data, scene)) { attached[scene.id] = null; continue; }
      const section = document.getElementById(scene.id);
      if (!section || !section.matches("[data-scene]")) { done = false; continue; }
      const panel = panelFor(data, scene);
      attached[scene.id] = panel && place(scene, section, panel) ? panel : null;
    }
    return done;
  }

  function start() {
    if (attachAll()) return;
    const obs = new MutationObserver(() => { if (attachAll()) obs.disconnect(); });
    obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(() => obs.disconnect(), 15000);
  }

  // Slides: "t" opens or closes the current slide's data.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "t" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.matches && e.target.matches("input, textarea, [contenteditable]")) return;
    if (!slides()) return;
    const cur = document.querySelector(".scene.is-current .scene-data");
    if (cur) { cur.open = !cur.open; e.preventDefault(); }
  });

  // Print: a PDF handout carries the data.
  const reopened = [];
  window.addEventListener("beforeprint", () => {
    document.querySelectorAll("details.scene-data:not([open])").forEach(d => { d.open = true; reopened.push(d); });
  });
  window.addEventListener("afterprint", () => { while (reopened.length) reopened.pop().open = false; });

  window.__DSTORY_DATA_PANEL__ = {
    MAX_ROWS, attached, option, fmt, csvRow, csvCell, columnsOf, rowsOf, rawColumns, cellText,
    expected: (scene) => {
      const data = dataOf();
      return { table: option(data, scene, "table"), download: option(data, scene, "download"),
               placed: scene.kind !== "custom" || !slides() };
    },
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true });
  else start();
})();

// dstory chart explorer: every chart can be read with the keyboard.
//
// Injected by `dstory bundle` next to the data panel (it reuses the panel's
// number formatting). Every scene with a `dataset` gets a focusable chart:
// Tab to it and a live region speaks a summary ("Signups, 6 points, from 1,000
// to 3,400, rising"); the arrow keys then step through the rows ("Mar: 2,900
// (Signups), 3 of 6"). It reads window.__STORY_DATA__, never the chart's
// internals, so it works for recipes, your own D3 and Vizzu alike.
//
//   Left / Right   previous / next point        Home / End   first / last point
//   Up / Down      previous / next series       Enter        the summary again
//   Escape         leave the chart (in slides, the arrows go back to the deck)
//
// Turn it off with "a11y": {"explorer": false} in meta or a scene, or for the
// whole bundle with `dstory bundle my-story --no-a11y-extras`.
(() => {
  "use strict";
  if (window.__DSTORY_EXPLORER__) return;
  const panel = () => window.__DSTORY_DATA_PANEL__;
  const dataOf = () => window.__STORY_DATA__ || null;
  const attached = {};
  const state = new WeakMap();

  const opt = (data, scene, key) => {
    if (panel()) return panel().option(data, scene, key);
    const s = (scene && scene.a11y) || {}, m = (data && data.meta && data.meta.a11y) || {};
    const v = s[key] != null ? s[key] : m[key] != null ? m[key] : true;
    return v !== false;
  };
  const fmt = (v, raw) => panel() ? panel().fmt(v, raw)
    : (typeof v === "number" ? v.toLocaleString() : v == null ? "" : String(v));
  const pretty = (c) => String(c).replace(/[_-]+/g, " ").trim();

  // ---- which columns play which part ------------------------------------
  const DATEISH_NAME = /^(date|time|period|year|month|day|week|quarter|yr|fy)s?$/i;
  const DATEISH_VALUE = /^\d{4}(-\d{2}(-\d{2})?)?([T ][\d:.]+Z?)?$/;
  const GENERIC = /^(value|values|y|amount|val)$/i;

  function rolesOf(rows, cols, scene) {
    const cfg = (scene && typeof scene.config === "object" && scene.config) || {};
    const vals = (c) => rows.map(r => (r ? r[c] : null)).filter(v => v !== null && v !== undefined);
    const isNum = (c) => { const v = vals(c); return v.length > 0 && v.every(x => typeof x === "number"); };
    const distinct = (c) => new Set(vals(c).map(String)).size;
    const raw = panel() ? panel().rawColumns(rows, cols, scene) : cols.map(() => false);
    const isRaw = (c) => raw[cols.indexOf(c)];
    const pick = (keys, ok) => {
      for (const k of keys) { const c = cfg[k]; if (typeof c === "string" && cols.includes(c) && ok(c)) return c; }
      return null;
    };
    const dateish = (c) => DATEISH_NAME.test(String(c)) || (!isNum(c) && vals(c).length > 0
      && vals(c).every(v => typeof v === "string" && DATEISH_VALUE.test(v)));
    const n = rows.length;

    // The point's name: the x / label column if it is not a measure.
    let name = pick(["label", "x", "period"], c => !isNum(c) || isRaw(c))
      || cols.find(c => dateish(c))
      || cols.find(c => !isNum(c))
      || cols.find(c => isRaw(c)) || null;
    // A series column groups the rows into lines, panels or groups.
    let series = pick(["series", "group", "color"], c => c !== name && !isNum(c));
    if (!series && name && distinct(name) < n) {
      series = cols.find(c => c !== name && !isNum(c) && distinct(c) >= 2 && distinct(c) <= 24
        && distinct(c) < n) || null;
    }
    // The measures read out at each point.
    let measures = ["x", "y", "value", "start", "end"].map(k => cfg[k])
      .filter((c, i, a) => typeof c === "string" && cols.includes(c) && c !== name && isNum(c) && a.indexOf(c) === i);
    if (!measures.length) {
      for (const d of ["y", "value", "start", "end"]) if (cols.includes(d) && d !== name && isNum(d)) measures.push(d);
    }
    if (!measures.length) measures = cols.filter(c => c !== name && c !== series && isNum(c) && !isRaw(c));
    if (!measures.length) measures = cols.filter(c => c !== name && c !== series && isNum(c));
    measures = measures.slice(0, 4);
    const primary = measures.includes(cfg.end || "end") ? (cfg.end || "end")
      : measures.includes(cfg.y || "y") ? (cfg.y || "y") : measures[measures.length > 1 && cfg.x && measures[0] === cfg.x ? 1 : 0];
    const ordered = !!name && (dateish(name) || isNum(name));
    const notes = measures.length ? [] : cols.filter(c => c !== name && c !== series && !isNum(c)).slice(0, 2);
    const roles = { name, series, measures, notes, primary: primary || null, ordered, nameRaw: !!name && isRaw(name) };
    roles.nameText = nameFormatter(rows, roles);
    return roles;
  }

  // "2024-05-01" reads as "May 2024" (or "2024" when every date is 1 Jan),
  // in the story's language. Anything else is shown as it is.
  const ISO = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/;
  function nameFormatter(rows, roles) {
    const base = (v) => fmt(v, roles.nameRaw);
    if (!roles.name) return base;
    const vs = rows.map(r => (r ? r[roles.name] : null)).filter(v => v != null);
    if (!vs.length || !vs.every(v => typeof v === "string" && ISO.test(v))) return base;
    const parts = vs.map(v => v.match(ISO));
    const yearOnly = parts.every(m => m[2] === "01" && (!m[3] || m[3] === "01"));
    const monthOnly = parts.every(m => !m[3] || m[3] === "01");
    const lang = (dataOf() && dataOf().meta && dataOf().meta.lang) || undefined;
    let df;
    try {
      df = new Intl.DateTimeFormat(lang, yearOnly ? { year: "numeric", timeZone: "UTC" }
        : monthOnly ? { month: "short", year: "numeric", timeZone: "UTC" }
        : { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    } catch (e) { return base; }
    return (v) => {
      const m = typeof v === "string" ? v.match(ISO) : null;
      return m ? df.format(new Date(Date.UTC(+m[1], +m[2] - 1, +(m[3] || 1)))) : base(v);
    };
  }

  function groupsOf(rows, roles) {
    if (!roles.series) return [{ key: null, idx: rows.map((_, i) => i) }];
    const map = new Map();
    rows.forEach((r, i) => {
      const k = r ? r[roles.series] : null;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(i);
    });
    return Array.from(map, ([key, idx]) => ({ key, idx }));
  }

  // ---- what is said ------------------------------------------------------
  function pointText(rows, roles, g, k) {
    const r = rows[g.idx[k]] || {};
    const nm = roles.name ? roles.nameText(r[roles.name]) : `Row ${g.idx[k] + 1}`;
    const ms = roles.measures;
    let body;
    if (!ms.length) body = roles.notes.map(c => fmt(r[c])).filter(Boolean).join(", ");
    else if (ms.length === 1 && GENERIC.test(String(ms[0]))) body = fmt(r[ms[0]]);
    else body = ms.map(m => `${pretty(m)} ${fmt(r[m])}`).join(", ");
    const ser = roles.series ? ` (${fmt(g.key)})` : "";
    return `${nm}${body ? ": " + body : ""}${ser}, ${k + 1} of ${g.idx.length}`;
  }

  function trendWord(a, b) {
    if (typeof a !== "number" || typeof b !== "number") return "";
    const base = Math.max(Math.abs(a), Math.abs(b)) || 1;
    if (Math.abs(b - a) / base < 0.01) return "roughly flat";
    return b > a ? "rising" : "falling";
  }

  function groupSummary(rows, roles, g) {
    const p = roles.primary;
    const label = roles.series ? `${fmt(g.key)}, ` : "";
    const count = `${g.idx.length} ${roles.ordered ? "point" : "item"}${g.idx.length === 1 ? "" : "s"}`;
    if (!p) {
      if (roles.ordered && roles.name && g.idx.length > 1) {
        const first = rows[g.idx[0]] || {}, lastR = rows[g.idx[g.idx.length - 1]] || {};
        return `${label}${count}, from ${roles.nameText(first[roles.name])} to ${roles.nameText(lastR[roles.name])}`;
      }
      return `${label}${count}`;
    }
    const pts = g.idx.map(i => rows[i] || {}).filter(r => typeof r[p] === "number");
    if (!pts.length) return `${label}${count}`;
    const nameOf = (r) => roles.name ? roles.nameText(r[roles.name]) : "";
    let hi = pts[0], lo = pts[0];
    for (const r of pts) { if (r[p] > hi[p]) hi = r; if (r[p] < lo[p]) lo = r; }
    if (roles.ordered && pts.length > 1) {
      const a = pts[0], b = pts[pts.length - 1];
      let s = `${label}${count}, from ${fmt(a[p])} to ${fmt(b[p])}, ${trendWord(a[p], b[p])}`;
      if (hi !== a && hi !== b) s += `, peaking at ${fmt(hi[p])}${roles.name ? " in " + nameOf(hi) : ""}`;
      else if (lo !== a && lo !== b) s += `, dipping to ${fmt(lo[p])}${roles.name ? " in " + nameOf(lo) : ""}`;
      return s;
    }
    if (pts.length === 1) return `${label}${count}: ${fmt(pts[0][p])}`;
    const what = roles.measures.length > 1 || !GENERIC.test(String(p)) ? ` ${pretty(p)}` : "";
    return `${label}${count}; highest${what} ${nameOf(hi)} (${fmt(hi[p])}), lowest${what} ${nameOf(lo)} (${fmt(lo[p])})`;
  }

  const headlineOf = (s) => s.headline
    || (s.steps && s.steps[0] && s.steps[0].headline)
    || (s.frames && s.frames[0] && s.frames[0].headline) || s.id;

  function summaryText(scene, rows, roles, groups) {
    const parts = groups.map(g => groupSummary(rows, roles, g));
    const keys = roles.series && groups.length > 1
      ? "Left and right arrows step through the points, up and down switch series"
      : "Arrow keys step through the data";
    return `${headlineOf(scene)}. ${parts.join("; ")}. ${keys}; Escape leaves the chart.`;
  }

  // ---- the live region ---------------------------------------------------
  let live = null;
  function liveRegion() {
    if (live && live.isConnected) return live;
    live = document.createElement("div");
    live.className = "scene-explore__live";
    live.id = "dstory-explore-live";
    live.setAttribute("aria-live", "polite");
    live.setAttribute("aria-atomic", "true");
    document.body.append(live);
    return live;
  }
  function say(text) {
    const r = liveRegion();
    // Re-announce identical text (Home pressed twice) by clearing first.
    if (r.textContent === text) r.textContent = "";
    r.textContent = text;
  }
  let hint = null;
  function hintId() {
    if (!hint || !hint.isConnected) {
      hint = document.createElement("span");
      hint.id = "dstory-explore-hint";
      hint.hidden = true;
      hint.textContent = "Interactive chart. Arrow keys step through the data; Escape leaves the chart.";
      document.body.append(hint);
    }
    return hint.id;
  }

  // ---- wiring ------------------------------------------------------------
  function attach(data, scene, mount) {
    const rows = panel() ? panel().rowsOf(data, scene) : null;
    if (!rows) return null;
    const cols = panel().columnsOf(rows, scene);
    const roles = rolesOf(rows, cols, scene);
    const groups = groupsOf(rows, roles);
    const st = { scene, rows, roles, groups, g: 0, k: -1 };
    state.set(mount, st);
    mount.setAttribute("tabindex", "0");
    mount.setAttribute("role", "application");
    mount.setAttribute("aria-roledescription", "chart");
    mount.setAttribute("aria-describedby", hintId());
    mount.setAttribute("data-explore", scene.id);
    mount.addEventListener("focus", () => {
      liveRegion().classList.add("is-visible");
      say(summaryText(scene, rows, roles, groups));
    });
    mount.addEventListener("blur", () => { liveRegion().classList.remove("is-visible"); });
    mount.addEventListener("keydown", (e) => onKey(e, mount, st));
    return mount;
  }

  function onKey(e, mount, st) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const g = st.groups[st.g];
    const last = g.idx.length - 1;
    let handled = true;
    switch (e.key) {
      case "ArrowRight": st.k = Math.min(last, st.k + 1); break;
      case "ArrowLeft":  st.k = st.k < 0 ? 0 : Math.max(0, st.k - 1); break;
      case "Home":       st.k = 0; break;
      case "End":        st.k = last; break;
      case "ArrowDown":
      case "ArrowUp": {
        if (st.groups.length < 2) { handled = false; break; }
        const step = e.key === "ArrowDown" ? 1 : -1;
        const prevName = st.k >= 0 && st.roles.name ? String((st.rows[g.idx[st.k]] || {})[st.roles.name]) : null;
        st.g = (st.g + step + st.groups.length) % st.groups.length;
        const ng = st.groups[st.g];
        // Keep the same x when the next series has it; else the same position.
        let k = prevName === null ? Math.max(0, st.k) : ng.idx.findIndex(i => String((st.rows[i] || {})[st.roles.name]) === prevName);
        if (k < 0) k = Math.min(Math.max(0, st.k), ng.idx.length - 1);
        st.k = k;
        break;
      }
      case "Enter": say(summaryText(st.scene, st.rows, st.roles, st.groups)); e.preventDefault(); e.stopPropagation(); return;
      case "Escape": mount.blur(); e.preventDefault(); e.stopPropagation(); return;
      default: handled = false;
    }
    if (!handled) return;
    e.preventDefault();
    e.stopPropagation();          // in slides mode, the arrows belong to the chart now
    say(pointText(st.rows, st.roles, st.groups[st.g], st.k));
  }

  function attachAll() {
    const data = dataOf();
    if (!data || !Array.isArray(data.scenes) || !panel()) return true;
    let done = true;
    for (const scene of data.scenes) {
      if (!scene || !scene.id || attached[scene.id] !== undefined) continue;
      if (!panel().rowsOf(data, scene) || scene.kind === "custom" || !opt(data, scene, "explorer")) {
        attached[scene.id] = null;
        continue;
      }
      const section = document.getElementById(scene.id);
      const mount = section && section.matches("[data-scene]")
        ? section.querySelector(`[data-mount="${CSS.escape(scene.id)}"]`) : null;
      if (!mount) { done = false; continue; }
      attached[scene.id] = attach(data, scene, mount);
    }
    return done;
  }

  function start() {
    if (attachAll()) return;
    const obs = new MutationObserver(() => { if (attachAll()) obs.disconnect(); });
    obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(() => obs.disconnect(), 15000);
  }

  window.__DSTORY_EXPLORER__ = {
    attached, rolesOf, groupsOf, pointText, summaryText,
    expected: (scene) => !!(scene && scene.kind !== "custom" && opt(dataOf(), scene, "explorer")),
    // For tests and the vetter: what the explorer says for a scene's point.
    describe: (sceneId, g, k) => {
      const m = attached[sceneId];
      const st = m && state.get(m);
      if (!st) return null;
      return k == null ? summaryText(st.scene, st.rows, st.roles, st.groups)
        : pointText(st.rows, st.roles, st.groups[g], k);
    },
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true });
  else start();
})();

</script>
</body>
</html>
