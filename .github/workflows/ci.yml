name: CI

on:
  push:
    branches: [main, "sweep-*", "harden-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole suite, browser e2e included, on every supported Python.
  # Pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, where Playwright
  # cannot install Chromium, and CI went red on 2026-11-10.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run the full suite
        run: uv run pytest -q -p no:cacheprovider

  # The wheel a user gets from PyPI: build it, install it into a clean venv
  # with no dev tools, and make and vet a story from the CLI.
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build --out-dir dist
      - name: Smoke-test the wheel in a clean venv
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python "$(ls dist/*.whl)[all]"
          /tmp/clean/bin/python -m playwright install --with-deps chromium
          cd "$(mktemp -d)"
          printf 'team,wins\nRed,42\nBlue,35\nGreen,28\nGold,19\n' > teams.csv
          /tmp/clean/bin/dstory draft teams.csv --vendor
          test -s teams/dist/story.html
          /tmp/clean/bin/dstory vet teams/dist/story.html --data teams/data.json
